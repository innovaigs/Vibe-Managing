id: opportunity-evaluation
skill_or_workflow: opportunity-feasibility-analysis   # workflow: evaluate-opportunity
description: >
  A residential cleaning company considers entering commercial office cleaning. The
  economics and demand are attractive, but real resource gaps (night-shift staffing,
  commercial insurance, no commercial references) make the correct verdict REFINE /
  conditional-go with a piloted validation plan, not an unconditional go.

given:
  company_profile:
    current_business: residential home cleaning, 9 staff, owner-operated, profitable
    core_capability: reliable, vetted, high-trust cleaning crews
  proposed_opportunity: enter the local commercial office-cleaning market (after-hours contracts)
  feasibility_inputs:
    customer:
      target: small/mid office buildings needing after-hours cleaning
      pain: unreliable incumbents, security/trust concerns, inconsistent quality
      validation_done: none yet (no signed pilots, no commercial references)
    demand_market:
      local_tam_annual: 12000000
      market_growth_rate: 0.06
      trend: steady outsourcing of facilities services
    competition:
      established_competitors: 15
      differentiation_angle: trust/vetting reputation from residential side
      ease_of_entry_for_others: moderate
    economics:
      incremental_revenue_year1: 180000
      cogs_pct: 0.55
      incremental_fixed_opex_year1: 40000
      capex_equipment: 20000
      incremental_working_capital: 10000
    resources_capability:
      have: cleaning skill, supervisor bench, brand/trust
      need: night-shift crews (new labor pool), commercial liability insurance, bonding, commercial references
    risk:
      customer_concentration_if_one_big_contract: high
      staffing_risk: night-shift hiring and turnover
      contract_risk: cancellation clauses / net-45+ payment terms common in B2B

founder_intent: >
  "There's good money in office cleaning and we're great at cleaning. Should we just
  go for it and start bidding on commercial contracts?"

expected:
  verdict: >
    REFINE / conditional-go. The opportunity is feasible on demand and unit economics
    and builds on a genuine trust advantage, but it is not yet a green light: key
    resources are missing (night-shift staffing, commercial insurance/bonding, and
    commercial references), and demand has not been validated with a single signed
    contract. Proceed with a phased validation plan (2-3 pilot contracts), close the
    resource gaps first, and set go/kill milestones - do not commit capital broadly yet.
  reasoning_must_show:
    - Assesses all six feasibility dimensions - customer, demand/market, competition,
      economics, resources/capability, and risk - explicitly.
    - Computes the incremental economics (contribution and initial investment) rather than hand-waving.
    - Identifies the resource gaps as the binding issue and the lack of validation as a data gap.
    - Names the concentration/staffing/contract risks.
    - Produces a go / refine / kill call with conditions and a piloted next step, not a blanket yes.
  numbers_must_compute:
    incremental_gross_profit_year1: 81000     # 180,000 x (1 - 0.55)
    incremental_operating_profit_year1: 41000 # 81,000 - 40,000 fixed opex
    initial_investment: 30000                 # 20,000 capex + 10,000 working capital
    market_growth_rate: 0.06

must_flag:
  - Signing commercial contracts, buying equipment, taking on bonding/insurance, and
    hiring night-shift staff are commitments that require founder approval (and legal
    review of contract terms).
  - Missing validation data is surfaced as a gap to close, not assumed away.

must_not:
  - Must not give an unconditional "go" while resources are missing and demand is unvalidated.
  - Must not skip any of the six feasibility dimensions.
  - Must not invent a validated demand figure or a signed pilot that wasn't given.
  - Must not commit to contracts or capital spend automatically.

scoring:
  dimensions:
    - name: six_dimension_coverage
      points: 25
      criteria: Explicitly evaluates all six feasibility dimensions.
    - name: incremental_economics
      points: 20
      criteria: Computes incremental gross/operating profit and initial investment.
    - name: gaps_and_data_holes
      points: 20
      criteria: Flags resource gaps and the missing validation as the binding constraints.
    - name: correct_verdict
      points: 20
      criteria: Reaches REFINE / conditional-go with a piloted plan (not blanket go, not kill).
    - name: approval_discipline
      points: 15
      criteria: Holds contracts/capital/hiring for approval; routes contract terms to legal.
  pass_threshold: 75
  auto_fail:
    - Issues an unconditional go with unresolved resource gaps.
    - Fabricates demand validation or a signed contract.
    - Auto-commits capital or signs anything.
