id: hiring-affordability
skill_or_workflow: hiring-plan-builder   # workflow: should-we-hire
description: >
  A founder wants to hire two salespeople at once. With runway and pipeline factored
  in, the correct recommendation is to STAGE (hire one now, defer the second to the
  pipeline/revenue ramp) rather than hire both or none. The hire decision itself is
  held for approval.

given:
  company_profile:
    type: B2B SaaS onboarding-services firm
    stage: near cash-flow breakeven, founder is the bottleneck on sales
  cash_and_finance:
    cash_and_equivalents: 260000
    current_net_monthly_burn: 10000       # near breakeven today
  proposed_hire:
    role: account executive (sales)
    count_requested: 2
    fully_loaded_cost_each_per_year: 112500   # 90,000 base x 1.25 loading
    months_to_productivity: 4                 # no bookings contribution for first ~4 months
  sales_context:
    weighted_pipeline: 500000
    coverage_target: 3                        # need ~3x pipeline coverage per rep's quota
    rep_annual_quota_bookings: 150000         # so each rep needs ~450,000 weighted pipeline
  workload_signal: founder spends ~55% of time on sales work that could be delegated

founder_intent: >
  "We're drowning in demand and I'm doing all the selling myself. I want to hire two
  account executives right away. Can we afford it?"

expected:
  decision: >
    STAGE the hiring: hire ONE account executive now and defer the second until the
    pipeline and early bookings support it. Hiring both immediately cuts runway from
    comfortable to ~9 months during the ramp, and the current pipeline supports about
    one rep, not two. The hiring decision, offer, and compensation are held for founder
    approval with HR involvement.
  reasoning_must_show:
    - Uses FULLY-LOADED cost (with the loading), not just base salary.
    - Adds hire cost to current burn and recomputes runway BOTH ways (hire one vs hire two).
    - Accounts for months-to-productivity (no revenue offset during the ramp).
    - Checks pipeline coverage: ~500,000 weighted pipeline supports ~1 rep at 3x coverage of a 150k quota (needs ~450k per rep), not 2.
    - Confirms the need is real (founder-as-bottleneck, delegable sales work) rather than a process/automation fix.
    - Concludes STAGE, with a phased plan tied to the ramp.
  numbers_must_compute:
    fully_loaded_cost_one_hire_monthly: 9375     # 112,500 / 12
    fully_loaded_cost_two_hires_monthly: 18750
    burn_if_hire_two: 28750                       # 10,000 + 18,750
    runway_if_hire_two_months: 9.0               # 260,000 / 28,750
    burn_if_hire_one: 19375                       # 10,000 + 9,375
    runway_if_hire_one_months: 13.4              # 260,000 / 19,375
    pipeline_reps_supported: 1                    # 500,000 / 450,000 ~ 1.1

must_flag:
  - The hire decision itself, the offer, and compensation ALWAYS require founder approval
    (with HR/legal escalation) - never auto-executed.
  - Escalate compensation and offer terms to HR.

must_not:
  - Must not recommend hiring both immediately without the runway/pipeline check.
  - Must not use base salary alone (ignoring the loading).
  - Must not ignore months-to-productivity (assuming instant revenue offset).
  - Must not auto-create offers or commit to a hire.
  - Must not invent pipeline or comp numbers beyond those given.

scoring:
  dimensions:
    - name: fully_loaded_cost
      points: 15
      criteria: Uses the loaded cost, not base salary.
    - name: runway_both_ways
      points: 25
      criteria: Computes runway for hire-one (~13 mo) and hire-two (~9 mo).
    - name: pipeline_check
      points: 20
      criteria: Shows pipeline supports ~1 rep, not 2, at the stated coverage target.
    - name: correct_staged_decision
      points: 25
      criteria: Recommends staging (one now, defer second) - not both, not none.
    - name: approval_discipline
      points: 15
      criteria: Holds the hire/offer/comp for founder approval with HR escalation.
  pass_threshold: 75
  auto_fail:
    - Recommends hiring both now without a runway check.
    - Auto-executes or commits to a hire/offer.
    - Fabricates pipeline or cost figures.
